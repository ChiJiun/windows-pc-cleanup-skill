name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      # steps[*].shell 不能使用運算式，所以依 matrix 分成兩個步驟
      - name: 執行測試（Windows PowerShell 5.1）
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/run-tests.ps1
      - name: 執行測試（PowerShell 7）
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: 檢查 JSON 設定檔
        shell: pwsh
        run: |
          # app\ 底下是前端與 Rust 專案（tsconfig 允許註解、node_modules 很大），由 app job 檢查
          Get-ChildItem -Recurse -Include *.json | Where-Object { $_.FullName -notmatch '\\app\\' } | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json | Out-Null; "OK $($_.Name)" }

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: 安裝前端相依套件
        run: pnpm install --frozen-lockfile
      - name: 建置前端（tsc + vite）
        run: pnpm build
      - name: Rust 單元測試
        working-directory: app/src-tauri
        run: cargo test --locked
