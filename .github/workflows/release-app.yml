name: Release desktop app

# 推送 app-v* 標籤（例如 app-v0.1.0）或手動執行時，建置 exe 並建立「草稿」Release。
# 草稿要由維護者檢查後手動發佈，不會自動公開。
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 安裝相依套件
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: 測試
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: 建置 exe 與安裝檔
        working-directory: app
        run: pnpm tauri build

      # 程式碼簽章（SignPath Foundation 免費開源簽章）：申請通過後在這裡加上簽章步驟，
      # 設定方式見 app/README.md 的「程式碼簽章」。目前發佈的是未簽章版本。

      - name: 整理發佈檔案並計算 SHA256
        id: files
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $out = New-Item -ItemType Directory -Force dist-release
          Copy-Item app/src-tauri/target/release/pc-cleanup.exe (Join-Path $out "windows-pc-cleanup-$version-portable-x64.exe")
          Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ (Join-Path $out "windows-pc-cleanup-$version-setup-x64.exe") }
          Get-ChildItem $out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content (Join-Path $out SHA256SUMS.txt) -Encoding ascii
          Get-Content (Join-Path $out SHA256SUMS.txt)
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-pc-cleanup-${{ steps.files.outputs.version }}
          path: dist-release/*

      - name: 建立草稿 Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows PC Cleanup desktop app ${{ steps.files.outputs.version }}

          - portable：單一 exe，免安裝（需要 WebView2，Windows 11 已內建）
          - setup：安裝到目前使用者，不需要系統管理員權限
          - 請用 SHA256SUMS.txt 核對下載的檔案：Get-FileHash <檔名> -Algorithm SHA256
          - 這個版本尚未做程式碼簽章，第一次執行時 Windows SmartScreen 可能會警告「未知的發行者」
          "@
          gh release create "${{ github.ref_name }}" dist-release/* --draft --title "Desktop app ${{ steps.files.outputs.version }}" --notes $notes
